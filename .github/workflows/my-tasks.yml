name: My-GitHubActions-Basics
env:
  APPLICATION_NAME: "MyFlask"
  DEPLOY_PACKAGE_NAME: "flask_deploy_ver-${{ github.sha }}"
  # github.sha - commit hash

on: 
  push:
    branches:
      - main
    # - master

jobs:
  my_testing:
    runs-on: ubuntu-latest

    steps:
    - name: Print Hello Message in Testing
      run: echo "Hello World from Testing job"

    - name: Execute few commands
      run: |
        echo "Hello Message1"
        echo "Hello Message2"
        echo "Application name: ${{ env.APPLICATION_NAME }}"

    - name: List current folder
      run: ls -la

    - name: Git clone my repo
      uses: actions/checkout@v1
    # adding files of repository
    
    - name: List current folder
      run: ls -la

  my_deploy:
    runs-on: ubuntu-latest
    needs: my_testing
    # aftter my_testing job
    
    steps:
    - name: Print Hello Message in Deploy
      run: echo "Hello World from Deploying job"

    - name: Deployment package
      run: |
          echo "Deployment package name: ${{ env.DEPLOY_PACKAGE_NAME }}"  

    - name: Let's test some packages if they are here
      run: aws --version

    - name: Let's test some packages if they are here
      run: zip
