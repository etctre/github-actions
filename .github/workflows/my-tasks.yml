name: My-GitHubActions-Basics

on: 
  push:
    branches:
      - master

jobs:
  my_testing:
    runs-on: ubuntu-latest

    steps:
      - name: Print_Hello_Message
        run: echo "Hello World from Testing job"


  my_deploy:
      runs-on: ubuntu-latest
      steps:
      - name: Print_Hello_Message
        run: echo "Hello World from Deploying job"
